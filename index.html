<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050505" />
    <title>The One Ring — A Journey Across Middle-earth</title>
    <meta
      name="description"
      content="A scroll-driven film following the One Ring across the map of Middle-earth, from the Shire to Mount Doom."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050505'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%23B89B5E' stroke-width='2.4'/%3E%3C/svg%3E"
    />
    <!--
      The poster is the first frame of the film, so it is the first thing seen.
      Each viewport preloads only the poster that matches the video it will get
      (the split mirrors the one in ScrollVideo.tsx).
    -->
    <link rel="preload" as="image" href="/images/poster.webp" media="(min-width: 901px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/poster-720.webp" media="(max-width: 900px)" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
